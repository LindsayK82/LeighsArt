
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="description"
    content="Inquire about available works, commissions, and exhibitions by Leigh Witherell."
  >

  <title>Collect | Leigh Witherell</title>

  <link rel="stylesheet" href="css/style.css">
  <script src="js/gallery.js" defer></script>
</head>

<body class="collect-page">

  <!-- NAVIGATION -->

  <header class="site-header">

    <a class="site-logo" href="index.html">
      Leigh Witherell
    </a>

    <button
      class="menu-toggle"
      type="button"
      aria-label="Toggle navigation"
      aria-expanded="false"
      aria-controls="site-nav"
    >
      ☰
    </button>

    <nav
      id="site-nav"
      class="site-nav"
      aria-label="Main navigation"
    >
      <a href="works.html">Works</a>
      <a href="about.html">About</a>
      <a href="reviews.html">Reviews</a>
      <a href="installations.html">Installations</a>
      <a href="store.html">Store</a>
      <a href="commissions.html">Commissions</a>
      <a href="collect.html" aria-current="page">Collect</a>
    </nav>

  </header>


  <!-- COLLECT PAGE -->

  <main class="collect-main">

    <section class="collect-content">

      <!-- Envelope icon -->

      <svg
        class="collect-envelope"
        xmlns="http://www.w3.org/2000/svg"
        width="40"
        height="40"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect x="2" y="4" width="20" height="16" rx="2"/>
        <path d="m2 6 10 7 10-7"/>
      </svg>

      <h1>Collect</h1>

      <p class="collect-subtitle">
        Works available upon request
      </p>

      <!-- REPLACE THE EMAIL ADDRESS BELOW -->

      <a
        class="collect-inquire"
        href="mailto:leigh@witherell.net"
      >
        Inquire
      </a>

      <p class="collect-services">
        Available works
        <span aria-hidden="true">•</span>
        Commissions
        <span aria-hidden="true">•</span>
        Exhibitions
      </p>


      <!-- SOCIAL MEDIA -->

      <div class="collect-social">

        <h2>Follow</h2>

        <!-- REPLACE THE INSTAGRAM URL BELOW -->

        <a
          class="collect-instagram"
          href="https://www.instagram.com/leighwitherell/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Visit Leigh Witherell on Instagram"
        >

          <!-- Instagram camera icon -->

          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="34"
            height="34"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect
              x="2"
              y="2"
              width="20"
              height="20"
              rx="5"
              ry="5"
            />
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
          </svg>

        </a>

      </div>

    </section>

  </main>


  <!-- FOOTER -->

  <footer class="site-footer">
    © 2026 Leigh Witherell. All rights reserved.
  </footer>

</body>
</html>
